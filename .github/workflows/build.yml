name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            binary: esvg
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            asset: macos-aarch64
            binary: esvg
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            binary: esvg.exe
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      SLINT_NO_QT: '1'
      RUSTFLAGS: ${{ matrix.os == 'windows-2022' && '-C target-feature=+crt-static' || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p esvg --locked --target ${{ matrix.target }}

      - name: Upload release binary for main builds
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: binary-${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 90
