name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.1.0)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.inputs.tag }}

permissions:
  contents: read

jobs:
  find-build:
    name: Find main build for this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for successful main build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          wait_timeout_seconds=2400
          poll_interval_seconds=15
          deadline=$((SECONDS + wait_timeout_seconds))
          while (( SECONDS < deadline )); do
            build="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?head_sha=${RELEASE_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_branch == "main" and .event == "workflow_dispatch")] | sort_by(.run_number) | ((map(select(.conclusion == "success")) | last) // last) | select(. != null) | [.id, .status, (.conclusion // "pending")] | @tsv')"
            if [[ -n "$build" ]]; then
              IFS=$'\t' read -r run_id status conclusion <<< "$build"
              if [[ "$conclusion" == "success" ]]; then
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [[ "$status" == "completed" ]]; then
                printf 'Main build %s finished with %s for commit %s.\n' "$run_id" "$conclusion" "$RELEASE_SHA" >&2
                exit 1
              fi
              printf 'Waiting for main build %s (%s).\n' "$run_id" "$status"
            else
              printf 'Waiting for a main build to appear for commit %s.\n' "$RELEASE_SHA"
            fi
            sleep "$poll_interval_seconds"
          done
          printf 'Timed out after %s seconds waiting for a successful main build for commit %s.\n' "$wait_timeout_seconds" "$RELEASE_SHA" >&2
          exit 1

  package:
    name: Package ${{ matrix.name }}
    needs: find-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            asset: linux-x86_64
          - name: macOS Apple Silicon
            os: macos-15
            asset: macos-aarch64
          - name: Windows x86_64
            os: windows-2022
            asset: windows-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download binary from matching main build
        uses: actions/download-artifact@v6
        with:
          name: binary-${{ matrix.asset }}
          run-id: ${{ needs.find-build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/bin

      # Tags from before the CLI existed have no crates/cli and no CLI build
      # artifact, so they are packaged without it. Every later tag requires it.
      - name: Check whether this release includes the CLI
        id: cli
        shell: bash
        run: |
          if [[ -d crates/cli ]]; then
            echo "included=true" >> "$GITHUB_OUTPUT"
          else
            echo "included=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${RELEASE_TAG} has no crates/cli, so it is packaged without the command line tool."
          fi

      - name: Download CLI binary from matching main build
        if: steps.cli.outputs.included == 'true'
        uses: actions/download-artifact@v6
        with:
          name: cli-binary-${{ matrix.asset }}
          run-id: ${{ needs.find-build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/cli

      - name: Restore binary executable permissions
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/bin/esvg
          if [[ -f dist/cli/esvg-cli ]]; then
            chmod +x dist/cli/esvg-cli
          fi

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig1 \
            libfreetype6 \
            libwayland-client0 \
            libx11-6 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcursor1 \
            libxi6 \
            libxinerama1 \
            libxrandr2

      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage/share/applications
          cp dist/bin/esvg dist/stage/esvg
          chmod +x dist/stage/esvg
          contents=(esvg README.txt share)
          if [[ -f dist/cli/esvg-cli ]]; then
            mkdir -p dist/stage/cli
            cp dist/cli/esvg-cli dist/stage/cli/esvg
            chmod +x dist/stage/cli/esvg
            contents+=(cli)
            # The CLI is also released as a standalone file next to the AppImage.
            cp dist/cli/esvg-cli "dist/esvg-cli-${RELEASE_TAG}-linux-x86_64"
            chmod +x "dist/esvg-cli-${RELEASE_TAG}-linux-x86_64"
          fi
          for size in 16 24 32 48 64 128 256 512; do
            icon_dir="dist/stage/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$icon_dir"
            cp "crates/gui/assets/icons/linux/esvg-${size}x${size}.png" "$icon_dir/esvg.png"
          done
          cat > dist/stage/share/applications/esvg.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ESVG
          Exec=esvg
          Icon=esvg
          Terminal=false
          Categories=Graphics;
          MimeType=image/svg+xml;
          EOF
          cat > dist/stage/README.txt <<'EOF'
          ESVG

          Run ./esvg to start the application.
          This build requires the host system's standard Linux desktop libraries.
          For desktop integration, install esvg on PATH and copy the files in share/
          into the matching ~/.local/share/applications and ~/.local/share/icons locations.
          EOF
          if [[ -d dist/stage/cli ]]; then
            echo "The command line tool is in cli/esvg. Copy it to a folder on your PATH, such as ~/.local/bin." >> dist/stage/README.txt
          fi
          tar -czf "dist/esvg-${RELEASE_TAG}-${{ matrix.asset }}.tar.gz" -C dist/stage "${contents[@]}"

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: crates/gui/scripts/package-appimage.sh "${RELEASE_TAG}" dist/bin/esvg

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="dist/ESVG.app"
          version="${RELEASE_TAG#v}"
          bundle_version="${version%%-*}"
          bundle_version="${bundle_version%%+*}"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp dist/bin/esvg "$app/Contents/MacOS/esvg"
          cp crates/gui/assets/icons/macos/esvg.icns "$app/Contents/Resources/esvg.icns"
          chmod +x "$app/Contents/MacOS/esvg"
          # Executables belong in Contents/MacOS, so the bundle can be code signed later.
          if [[ -f dist/cli/esvg-cli ]]; then
            cp dist/cli/esvg-cli "$app/Contents/MacOS/esvg-cli"
            chmod +x "$app/Contents/MacOS/esvg-cli"
          fi
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>esvg</string>
            <key>CFBundleIconFile</key><string>esvg.icns</string>
            <key>CFBundleIdentifier</key><string>org.esvg.gui</string>
            <key>CFBundleName</key><string>ESVG</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${bundle_version}</string>
            <key>CFBundleVersion</key><string>${bundle_version}</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          stage="dist/macos-stage"
          mkdir -p "$stage"
          mv "$app" "$stage/"
          cat > "$stage/README.txt" <<'EOF'
          ESVG

          Open ESVG.app to start the application.

          If macOS says ESVG cannot be opened because it is from an unidentified
          developer, run this once in Terminal:
            xattr -dr com.apple.quarantine /Applications/ESVG.app
          EOF
          if [[ -f "$stage/ESVG.app/Contents/MacOS/esvg-cli" ]]; then
            cat >> "$stage/README.txt" <<'EOF'

          To use the command line tool, run this once in Terminal:
            sudo mkdir -p /usr/local/bin
            sudo ln -sf "/Applications/ESVG.app/Contents/MacOS/esvg-cli" /usr/local/bin/esvg
          Then run: esvg --help
          EOF
          fi
          ditto -c -k --sequesterRsrc "$stage" "dist/esvg-${RELEASE_TAG}-${{ matrix.asset }}.zip"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item dist/bin/esvg.exe dist/stage/esvg.exe
          $readme = @"
          ESVG $version

          Run esvg.exe to start the application.
          "@
          if (Test-Path dist/cli/esvg-cli.exe) {
            New-Item -ItemType Directory -Force dist/stage/cli | Out-Null
            Copy-Item dist/cli/esvg-cli.exe dist/stage/cli/esvg.exe
            $readme += "`nThe command line tool is in cli\esvg.exe."
          }
          $readme | Set-Content dist/stage/README.txt
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/esvg-${env:RELEASE_TAG}-${{ matrix.asset }}.zip" -Force

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:APP_VERSION = $env:RELEASE_TAG -replace '^v', ''
          $env:APP_BINARY = (Resolve-Path dist/bin/esvg.exe).Path
          if (Test-Path dist/cli/esvg-cli.exe) {
            $env:CLI_BINARY = (Resolve-Path dist/cli/esvg-cli.exe).Path
          }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler not found: $compiler"
          }
          & $compiler "crates/gui/packaging/windows/esvg.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload packaged application
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.asset }}
          path: dist/esvg-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Attach packages to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ESVG ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ !contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: dist/*
